<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- Sistema · Gestão de Frota · Desenvolvido por Kaio Eduardo de Oliveira Barbosa (Bené) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Kaio Eduardo de Oliveira Barbosa">
  <meta name="theme-color" content="#F26419">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Gestão de Frota</title>
  <link rel="icon" type="image/png" href="assets/logo-printminas.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo"><img src="assets/logo-printminas.png" alt="Print Minas"></div>
        <div>
          <h1>Frota</h1>
          <p>Print Minas</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" onclick="showTab('visao')"><i class="ti ti-layout-dashboard"></i>Visão
          geral</button>
        <button class="nav-btn" onclick="showTab('viagem')"><i class="ti ti-route"></i>Nova rota</button>
        <button class="nav-btn" onclick="showTab('registros')"><i class="ti ti-list"></i>Registros</button>
        <button class="nav-btn" onclick="showTab('motoristas')"><i class="ti ti-users"></i>Motoristas</button>
        <button class="nav-btn" onclick="showTab('ocorrencias')"><i
            class="ti ti-alert-triangle"></i>Ocorrências</button>
        <button class="nav-btn" onclick="showTab('relatorio')"><i class="ti ti-file-text"></i>Relatório</button>
      </nav>
      <div class="sidebar-tools">
        <div class="sidebar-admin"><button class="admin-access" id="admin-access" onclick="openAdminAccess()"><i
              class="ti ti-lock"></i><span>Área administrativa</span><span class="brand-pop" aria-hidden="true"><img
                src="assets/logo-printminas.png" alt=""></span></button></div>
        <button class="install-app" id="install-app" hidden><i class="ti ti-download"></i><span>Instalar
            aplicativo</span></button>
      </div>
    </aside>

    <main class="main" id="main-content"></main>
  </div>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema"><i
      class="ti ti-moon-stars"></i></button>
  <div id="modal-container"></div>
  <!-- Banco de dados -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <!-- Scripts locais -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
